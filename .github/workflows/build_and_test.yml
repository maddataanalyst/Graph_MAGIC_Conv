name: AML MAGIC build and check

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



permissions:
  contents: read


jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          poetry run ruff check --exit-zero
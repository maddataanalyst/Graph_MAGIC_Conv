services:
  graph_magic_conv:
    image: continuumio/miniconda3:24.11.1-0
    container_name: graph_magic_conv_container
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
      conda init bash && \
      . ~/.bashrc && \
      if [ ! -d /opt/conda/envs/aml_magic ]; then
        conda env create -f environment.yaml;
      fi && \
      conda init bash && \
      conda activate aml_magic && \
      pip install poetry && \
      poetry install --with dev --with jupyter --no-root && \
      dvc repro summarize_results --force
      "
    tty: true